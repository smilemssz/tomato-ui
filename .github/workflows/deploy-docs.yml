
name: Docs Validation

on:
  push:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -d docs
          echo "Required documentation files exist."

      - name: Check for empty Markdown files
        shell: bash
        run: |
          set -euo pipefail

          find docs -type f -name '*.md' -print0 |
          while IFS= read -r -d '' file; do
            if ! grep -q '[^[:space:]]' "$file"; then
              echo "::error file=$file::Markdown file is empty"
              exit 1
            fi
          done

          echo "Markdown files passed the basic check."
