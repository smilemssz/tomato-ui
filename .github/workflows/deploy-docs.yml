name: Docs Validation

on:
  push:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-lockfile-fix.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs-lockfile-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-docs:
    name: Validate documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # No setup-node or dependency cache is needed for Markdown-only docs.
      - name: Check required documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -d docs
          echo "README.md and docs/ exist."

      - name: Check Markdown files are not empty
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find docs -type f -name '*.md' -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No Markdown files were found under docs/"
            exit 1
          fi

          for file in "${files[@]}"; do
            if ! grep -q '[^[:space:]]' "$file"; then
              echo "::error file=$file::Markdown file is empty"
              exit 1
            fi
          done

          echo "All Markdown files are non-empty."
